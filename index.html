<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ナイススロー掲示板</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>ナイススロー掲示板</h1>

    <p>ゆっくり雑談するための掲示板です。</p>

    <hr>

    <h2>新規投稿</h2>

    <input type="text" id="name" placeholder="名前">

    <br><br>

    <textarea id="message" placeholder="メッセージを書こう" rows="5"></textarea>

    <br><br>

    <<button id="postButton">投稿</button>

    <hr>

    <h2>投稿一覧</h2>

    <div id="posts"></div>

    <script type="module" src="script.js"></script>

</body>
</html>
